---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/main/schema/compose-spec.json
services:
  ghost:
    # Do not alter this without updating the Tinybird Sync container as well
    image: ghost:${GHOST_VERSION:-6-alpine}
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    # This is required to import current config when migrating
    env_file:
      - .env
    environment:
      NODE_ENV: production
      url: https://${DOMAIN:?DOMAIN environment variable is required}
      admin__url: ${ADMIN_DOMAIN:+https://${ADMIN_DOMAIN}}
      database__client: mysql
      database__connection__host: db
      database__connection__user: ${DATABASE_USER:-ghost}
      database__connection__password: ${DATABASE_PASSWORD:?DATABASE_PASSWORD environment variable is required}
      database__connection__database: ghost
      tinybird__tracker__endpoint: https://${DOMAIN:?DOMAIN environment variable is required}/.ghost/analytics/api/v1/page_hit
      tinybird__adminToken: ${TINYBIRD_ADMIN_TOKEN:-}
      tinybird__workspaceId: ${TINYBIRD_WORKSPACE_ID:-}
      tinybird__tracker__datasource: analytics_events
      tinybird__stats__endpoint: ${TINYBIRD_API_URL:-https://api.tinybird.co}
    volumes:
      - ${UPLOAD_LOCATION:-./data/ghost}:/var/lib/ghost/content
    depends_on:
      db:
        condition: service_healthy
      tinybird-sync:
        condition: service_completed_successfully
        required: false
      tinybird-deploy:
        condition: service_completed_successfully
        required: false
      activitypub:
        condition: service_started
        required: false
    networks:
      - ghost_network
      - traefik-public
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - traefik.enable=true
      # Main site — apex domain
      - traefik.http.routers.ghost.rule=Host(`${DOMAIN:?DOMAIN environment variable is required}`)
      - traefik.http.routers.ghost.entrypoints=websecure
      - traefik.http.routers.ghost.tls=true
      - traefik.http.services.ghost.loadbalancer.server.port=2368
      # www → apex redirect
      - traefik.http.routers.ghost-www.rule=Host(`www.${DOMAIN:?DOMAIN environment variable is required}`)
      - traefik.http.routers.ghost-www.entrypoints=websecure
      - traefik.http.routers.ghost-www.tls=true
      - traefik.http.routers.ghost-www.middlewares=ghost-www-redirect
      - traefik.http.routers.ghost-www.service=ghost
      - traefik.http.middlewares.ghost-www-redirect.redirectregex.regex=^https://www\.(.+)
      - traefik.http.middlewares.ghost-www-redirect.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.ghost-www-redirect.redirectregex.permanent=true

  db:
    image: mysql:8.0-debian
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    expose:
      - "3306"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?DATABASE_ROOT_PASSWORD environment variable is required}
      MYSQL_USER: ${DATABASE_USER:-ghost}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD environment variable is required}
      MYSQL_DATABASE: ghost
      MYSQL_MULTIPLE_DATABASES: activitypub
    volumes:
      - ${MYSQL_DATA_LOCATION:-./data/mysql}:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: mysqladmin ping -p$$MYSQL_ROOT_PASSWORD -h 127.0.0.1
      interval: 1s
      start_period: 30s
      start_interval: 10s
      retries: 120
    networks:
      - ghost_network

  traffic-analytics:
    image: ghost/traffic-analytics:1.0.186@sha256:a0b8bba22d38fd18c1eb0b9476c457547516d5927c530180dca74a963af81660
    restart: unless-stopped
    mem_limit: 256MB
    mem_reservation: 64MB
    expose:
      - "3000"
    volumes:
      - traffic_analytics_data:/data
    environment:
      NODE_ENV: production
      PROXY_TARGET: ${TINYBIRD_API_URL:-https://api.tinybird.co}/v0/events
      SALT_STORE_TYPE: ${SALT_STORE_TYPE:-file}
      SALT_STORE_FILE_PATH: /data/salts.json
      TINYBIRD_TRACKER_TOKEN: ${TINYBIRD_TRACKER_TOKEN:-}
      LOG_LEVEL: debug
    profiles: [analytics]
    networks:
      - ghost_network
      - traefik-public
    labels:
      - traefik.enable=true
      # Analytics path: (prefix)/.ghost/analytics/(rest) → rewrite to /(rest) → traffic-analytics
      - traefik.http.routers.ghost-analytics.rule=Host(`${DOMAIN:?DOMAIN environment variable is required}`) && PathRegexp(`.*\\.ghost/analytics`)
      - traefik.http.routers.ghost-analytics.entrypoints=websecure
      - traefik.http.routers.ghost-analytics.tls=true
      - traefik.http.routers.ghost-analytics.middlewares=ghost-analytics-rewrite
      - traefik.http.routers.ghost-analytics.service=traffic-analytics
      - traefik.http.services.traffic-analytics.loadbalancer.server.port=3000
      # Strip prefix up to and including /.ghost/analytics, pass remainder to service
      - traefik.http.middlewares.ghost-analytics-rewrite.replacepathregex.regex=^.*\\.ghost/analytics(.*)$$
      - traefik.http.middlewares.ghost-analytics-rewrite.replacepathregex.replacement=$$1

  activitypub:
    image: ghcr.io/tryghost/activitypub:1.2.2@sha256:128f0d08d872930b4ab37c9fc1fe8042fefd44622316b05f3885bd068be7cc43
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    expose:
      - "8080"
    volumes:
      - ${UPLOAD_LOCATION:-./data/ghost}:/opt/activitypub/content
    env_file:
      - .env
    environment:
      # See https://github.com/TryGhost/ActivityPub/blob/main/docs/env-vars.md
      NODE_ENV: production
      MYSQL_HOST: db
      MYSQL_USER: ${DATABASE_USER:-ghost}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD environment variable is required}
      MYSQL_DATABASE: activitypub
      LOCAL_STORAGE_PATH: /opt/activitypub/content/images/activitypub
      LOCAL_STORAGE_HOSTING_URL: https://${DOMAIN}/content/images/activitypub
    depends_on:
      db:
        condition: service_healthy
      activitypub-migrate:
        condition: service_completed_successfully
    profiles: [activitypub]
    networks:
      - ghost_network
      - traefik-public
    labels:
      - traefik.enable=true
      # ActivityPub paths — higher priority than ghost-activitypub-ext@file (priority 5)
      - traefik.http.routers.ghost-activitypub.rule=Host(`${DOMAIN:?DOMAIN environment variable is required}`) && (PathPrefix(`/.ghost/activitypub/`) || Path(`/.well-known/webfinger`) || Path(`/.well-known/nodeinfo`))
      - traefik.http.routers.ghost-activitypub.entrypoints=websecure
      - traefik.http.routers.ghost-activitypub.tls=true
      - traefik.http.routers.ghost-activitypub.priority=10
      - traefik.http.services.activitypub.loadbalancer.server.port=8080

  # Supporting Services

  tinybird-login:
    build:
      context: ./tinybird
      dockerfile: Dockerfile
    working_dir: /home/tinybird
    mem_limit: 128m
    mem_reservation: 32m
    command: /usr/local/bin/tinybird-login
    volumes:
      - tinybird_home:/home/tinybird
      - tinybird_files:/data/tinybird
    profiles: [analytics]
    networks:
      - ghost_network
    tty: false
    restart: no

  tinybird-sync:
    # Do not alter this without updating the Ghost container as well
    image: ghost:${GHOST_VERSION:-6-alpine}
    mem_limit: 128m
    mem_reservation: 32m
    command: >
      sh -c "
        if [ -d /var/lib/ghost/current/core/server/data/tinybird ]; then
          rm -rf /data/tinybird/*;
          cp -rf /var/lib/ghost/current/core/server/data/tinybird/* /data/tinybird/;
          echo 'Tinybird files synced into shared volume.';
        else
          echo 'Tinybird source directory not found.';
        fi
      "
    volumes:
      - tinybird_files:/data/tinybird
    depends_on:
      tinybird-login:
        condition: service_completed_successfully
    networks:
      - ghost_network
    profiles: [analytics]
    restart: no

  tinybird-deploy:
    build:
      context: ./tinybird
      dockerfile: Dockerfile
    working_dir: /data/tinybird
    mem_limit: 128m
    mem_reservation: 32m
    command: >
      sh -c "
        tb-wrapper --cloud deploy
      "
    volumes:
      - tinybird_home:/home/tinybird
      - tinybird_files:/data/tinybird
    depends_on:
      tinybird-sync:
        condition: service_completed_successfully
    profiles: [analytics]
    networks:
      - ghost_network
    tty: true

  activitypub-migrate:
    image: ghcr.io/tryghost/activitypub-migrations:1.2.2@sha256:2af8a0726ac4362cdcab59c308ed612140478d43011ec8d3475bb2634b96d108
    mem_limit: 128m
    mem_reservation: 32m
    environment:
      MYSQL_DB: mysql://${DATABASE_USER:-ghost}:${DATABASE_PASSWORD:?DATABASE_PASSWORD environment variable is required}@tcp(db:3306)/activitypub
    networks:
      - ghost_network
    depends_on:
      db:
        condition: service_healthy
    profiles: [activitypub]
    restart: no

  ses-adapter:
    build:
      context: ./ses-adapter
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 16m
    environment:
      AWS_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY}
      AWS_REGION: eu-west-1
      DEFAULT_SENDER: hello@securitysaysyes.com
      LOG_LEVEL: normal
    volumes:
      - ./ses-adapter/config.json:/app/config.json:ro
    networks:
      - ghost_network

volumes:
  tinybird_files:
  tinybird_home:
  traffic_analytics_data:

networks:
  ghost_network:
  traefik-public:
    external: true
