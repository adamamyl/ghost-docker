name: Sync Upstream Main

on:
  schedule:
    - cron: '32 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/TryGhost/ghost-docker.git
          git fetch upstream

      - name: Check for new upstream commits
        id: check
        run: |
          upstream_sha=$(git rev-parse upstream/main)
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "No new upstream commits. Skipping sync."
            echo "new_commits=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream commits found: ${upstream_sha}"
            echo "new_commits=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update main branch
        id: merge_main
        if: steps.check.outputs.new_commits == 'true'
        run: |
          git checkout main
          if git merge upstream/main -m "chore: merge upstream main"; then
            echo "merge_status=success" >> "$GITHUB_OUTPUT"
            # main is protected — push to sync branch and open PR
            sync_branch="sync/upstream-$(date +%Y%m%d)"
            git checkout -B "${sync_branch}"
            git push origin "${sync_branch}" --force-with-lease
            gh pr create \
              --repo adamamyl/ghost-docker \
              --title "chore: sync upstream main $(date +%Y-%m-%d)" \
              --body "Automatic upstream sync to ${{ steps.check.outputs.upstream_sha }}. Merge to keep main current." \
              --head "${sync_branch}" \
              --base main \
              || echo "PR already exists"
            gh pr merge "${sync_branch}" \
              --repo adamamyl/ghost-docker \
              --auto \
              --merge \
              || echo "Auto-merge already set or PR already merged"
            # return to local main so downstream merges pick up upstream changes
            git checkout main
          else
            git merge --abort
            echo "merge_status=failure" >> "$GITHUB_OUTPUT"
            branch="sync/upstream-$(date +%Y%m%d)"
            git checkout -b "${branch}" upstream/main
            git push origin "${branch}"
            gh pr create \
              --title "CONFLICT: main needs manual merge from upstream" \
              --body "Automatic sync failed on upstream ${{ steps.check.outputs.upstream_sha }}. Resolve conflicts manually." \
              --head "${branch}" \
              --base main \
              --draft \
              || echo "PR already exists"
          fi

      - name: Merge main into securitysaysyes
        id: merge_ssy
        if: steps.check.outputs.new_commits == 'true' && steps.merge_main.outputs.merge_status == 'success'
        run: |
          git fetch origin securitysaysyes
          git checkout securitysaysyes
          if git merge main --no-edit -m "chore: merge upstream main into securitysaysyes"; then
            echo "merge_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "merge_status=failure" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Merge main into feat/ses-mail
        id: merge_ses
        if: steps.check.outputs.new_commits == 'true' && steps.merge_main.outputs.merge_status == 'success'
        run: |
          if ! git ls-remote --exit-code origin feat/ses-mail; then
            echo "Branch feat/ses-mail does not exist, skipping."
            echo "merge_status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin feat/ses-mail
          git checkout feat/ses-mail
          if git merge main --no-edit -m "chore: merge upstream main into feat/ses-mail"; then
            echo "merge_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "merge_status=failure" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Validate compose config (securitysaysyes)
        id: tests
        if: steps.check.outputs.new_commits == 'true' && steps.merge_main.outputs.merge_status == 'success' && steps.merge_ssy.outputs.merge_status == 'success'
        run: |
          git checkout securitysaysyes
          if printf 'DATABASE_PASSWORD=x\nDATABASE_ROOT_PASSWORD=x\nDOMAIN=x\nSES_ACCESS_KEY_ID=x\nSES_SECRET_ACCESS_KEY=x\n' > /tmp/.env.ci \
            && docker compose --env-file /tmp/.env.ci config --quiet 2>/dev/null; then
            echo "test_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "test_status=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branches or open PRs on failure
        if: steps.check.outputs.new_commits == 'true' && steps.merge_main.outputs.merge_status == 'success'
        run: |
          date_tag="$(date +%Y%m%d)"

          # securitysaysyes
          if [ "${{ steps.merge_ssy.outputs.merge_status }}" = "success" ]; then
            git checkout securitysaysyes
            ssy_branch="sync/ssy-upstream-${date_tag}"
            git checkout -B "${ssy_branch}"
            git push origin "${ssy_branch}" --force-with-lease
            gh pr create \
              --repo adamamyl/ghost-docker \
              --title "chore: sync upstream into securitysaysyes $(date +%Y-%m-%d)" \
              --body "Automatic upstream sync to ${{ steps.check.outputs.upstream_sha }}." \
              --head "${ssy_branch}" \
              --base securitysaysyes \
              || echo "PR already exists"
            gh pr merge "${ssy_branch}" \
              --repo adamamyl/ghost-docker \
              --auto \
              --merge \
              || echo "Auto-merge already set or PR already merged"
          else
            gh pr create \
              --repo adamamyl/ghost-docker \
              --title "CONFLICT: securitysaysyes needs manual merge from upstream" \
              --body "Automatic merge onto upstream ${{ steps.check.outputs.upstream_sha }} failed. Resolve manually." \
              --head securitysaysyes \
              --base main \
              --draft \
              || echo "PR already exists"
          fi

          # feat/ses-mail
          if [ "${{ steps.merge_ses.outputs.merge_status }}" = "success" ]; then
            git checkout feat/ses-mail
            ses_branch="sync/ses-upstream-${date_tag}"
            git checkout -B "${ses_branch}"
            git push origin "${ses_branch}" --force-with-lease
            gh pr create \
              --repo adamamyl/ghost-docker \
              --title "chore: sync upstream into feat/ses-mail $(date +%Y-%m-%d)" \
              --body "Automatic upstream sync to ${{ steps.check.outputs.upstream_sha }}." \
              --head "${ses_branch}" \
              --base feat/ses-mail \
              || echo "PR already exists"
            gh pr merge "${ses_branch}" \
              --repo adamamyl/ghost-docker \
              --auto \
              --merge \
              || echo "Auto-merge already set or PR already merged"
          elif [ "${{ steps.merge_ses.outputs.merge_status }}" = "failure" ]; then
            gh pr create \
              --repo adamamyl/ghost-docker \
              --title "CONFLICT: feat/ses-mail needs manual merge from upstream" \
              --body "Automatic merge onto upstream ${{ steps.check.outputs.upstream_sha }} failed. Resolve manually." \
              --head feat/ses-mail \
              --base main \
              --draft \
              || echo "PR already exists"
          fi

