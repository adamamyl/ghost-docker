name: Sync Upstream Releases (Safe)

on:
  schedule:
    - cron: '32 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Get latest upstream release
        id: upstream
        run: |
          latest=$(curl -s https://api.github.com/repos/TryGhost/ghost-docker/releases/latest \
            | jq -r .tag_name)
          echo "Latest upstream release: $latest"
          echo "latest_release=$latest" >> $GITHUB_OUTPUT

      - name: Get last synced release
        id: last
        run: |
          if [ ! -f .last_upstream_release ]; then
            echo "${{ steps.upstream.outputs.latest_release }}" > .last_upstream_release
            git add .last_upstream_release
            git commit -m "chore: initialise last upstream release tracker"
            git push origin main
          fi
          last=$(<.last_upstream_release)
          echo "Last synced release: $last"
          echo "last_release=$last" >> $GITHUB_OUTPUT

      - name: Check for new release
        id: check
        run: |
          if [ "${{ steps.upstream.outputs.latest_release }}" = "${{ steps.last.outputs.last_release }}" ]; then
            echo "No new upstream release. Skipping sync."
            echo "new_release=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream release found: ${{ steps.upstream.outputs.latest_release }}"
            echo "new_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Add upstream remote
        if: steps.check.outputs.new_release == 'true'
        run: |
          git remote add upstream https://github.com/TryGhost/ghost-docker.git || true
          git fetch upstream

      - name: Update main branch
        if: steps.check.outputs.new_release == 'true'
        run: |
          git checkout main
          git merge --ff-only upstream/main
          git push origin main

      - name: Rebase custom branch
        id: rebase
        if: steps.check.outputs.new_release == 'true'
        run: |
          git fetch origin securitysaysyes
          git checkout securitysaysyes
          if git rebase main; then
            echo "Rebase succeeded"
            echo "rebase_status=success" >> $GITHUB_OUTPUT
          else
            echo "Rebase failed"
            echo "rebase_status=failure" >> $GITHUB_OUTPUT
            git rebase --abort
          fi

      - name: Validate compose config
        id: tests
        if: steps.check.outputs.new_release == 'true' && steps.rebase.outputs.rebase_status == 'success'
        run: |
          echo "Validating Docker Compose configuration..."
          docker compose config --quiet
          echo "test_status=success" >> $GITHUB_OUTPUT

      - name: Push or open PR
        if: steps.check.outputs.new_release == 'true'
        run: |
          if [ "${{ steps.rebase.outputs.rebase_status }}" = "success" ]; then
            git push origin securitysaysyes --force
            if [ "${{ steps.tests.outputs.test_status }}" = "success" ]; then
              gh pr create \
                --title "Rebased securitysaysyes branch on upstream ${{ steps.upstream.outputs.latest_release }}" \
                --body "Branch rebased on upstream release ${{ steps.upstream.outputs.latest_release }}" \
                --head securitysaysyes \
                --base main \
                --draft || echo "PR already exists"
            fi
          else
            git push origin securitysaysyes --force || true
            gh pr create \
              --title "Rebase failed: securitysaysyes branch needs manual resolution" \
              --body "Automatic rebase onto upstream release ${{ steps.upstream.outputs.latest_release }} failed. Please resolve conflicts manually." \
              --head securitysaysyes \
              --base main \
              --draft || echo "PR already exists"
          fi

      - name: Save latest release
        if: steps.check.outputs.new_release == 'true'
        run: |
          git checkout main
          echo "${{ steps.upstream.outputs.latest_release }}" > .last_upstream_release
          git add .last_upstream_release
          git diff --staged --quiet || git commit -m "chore: update last synced upstream release to ${{ steps.upstream.outputs.latest_release }}"
          git push origin main
